# Site ko free plan par jagti rakhta hai (Render 15 minute baad so jati hai).
# Chalane ka tareeqa:
#   1. GitHub ▸ apna repo ▸ Settings ▸ Secrets and variables ▸ Actions ▸ Variables ▸ New variable
#      Name: SITE_URL     Value: https://AAPKA-LINK.onrender.com   (aakhir mein slash nahi)
#   2. Bas. Ye file har 10 minute baad khud site ko ping karegi.
# Note: is se Render ke 750 free ghante lagbhag poore kharch hote hain (ek hi service ke liye theek).
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL variable set nahi hai — Settings ▸ Secrets and variables ▸ Actions ▸ Variables"
            exit 0
          fi
          curl -fsS --max-time 30 --retry 2 "${{ vars.SITE_URL }}/api/health" && echo "site is awake"
